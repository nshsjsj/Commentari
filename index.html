<style>
/* Layout: barra superiore fissa con tasto Indietro, contenuto in colonna, libri come chip arrotondati */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --fg:#14213d; --muted:#64748b; --line:#e3e9f2;
  --accent:#1f5fd1; --accent-soft:#e8f0fe; --bar:#0f1f3d; --barfg:#ffffff;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#142036; --fg:#e7edf7; --muted:#94a3b8; --line:#22314d;
  --accent:#6ea8ff; --accent-soft:#1a2c4d; --bar:#0a1220; --barfg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#142036; --fg:#e7edf7; --muted:#94a3b8; --line:#22314d;
  --accent:#6ea8ff; --accent-soft:#1a2c4d; --bar:#0a1220; --barfg:#ffffff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barfg);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border:0;color:#fff;
  font:600 15px var(--font);padding:10px 14px 10px 10px;border-radius:999px;cursor:pointer;flex-shrink:0}
.back svg{width:20px;height:20px}
.back:hover,.back:focus-visible{background:rgba(255,255,255,.22);outline:none}
.bar-title{font-weight:800;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.testamento{font-size:1.9rem;font-weight:800;margin:22px 0 6px;letter-spacing:-.02em}
h2.testamento:not(:first-child){margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.books{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--fg);
  font:600 15px var(--font);padding:11px 14px;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.grid .btn{padding:12px 0;text-align:center}
.btn:hover,.btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);outline:none}
.links{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.link{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px;color:var(--fg);text-decoration:none;transition:border-color .15s}
.link:hover,.link:focus-visible{border-color:var(--accent);outline:none}
.link div{flex:1;min-width:0}
.link strong{display:block;font-size:1.02rem;font-weight:700}
.link small{color:var(--muted);font-size:.85rem}
.link .go{color:var(--accent);font-weight:800;font-size:1.2rem}
h2.ref{font-size:1.6rem;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.note{color:var(--muted);font-size:.85rem;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
</head>

const SEZ=[
 ["Antico Testamento",[["Pentateuco",0,5],["Libri storici",5,17],["Libri poetici e sapienziali",17,22],["Profeti maggiori",22,27],["Profeti minori",27,39]]],
 ["Nuovo Testamento",[["Vangeli",39,43],["Storia della Chiesa",43,44],["Lettere di Paolo",44,57],["Lettere generali",57,65],["Profezia",65,66]]]
];

const view=document.getElementById('view'), crumbs=document.getElementById('crumbs');
let st={b:null,c:null,v:null};

function sl(b){return b[1]==='songs'?'song-of-solomon':b[1].replace('_','-');}
function links(b,c,v){
  const s=sl(b), bh=b[1], i=B.indexOf(b), AT=i<39;
  const GODET={41:["Vangelo di Luca","https://biblicalstudies.org.uk/blog/frederic-godets-commentary-on-the-gospel-of-luke/"],
    42:["Vangelo di Giovanni","https://biblicalstudies.org.uk/book_gospel-of-john_godet.html"],
    44:["Romani","https://biblicalstudies.org.uk/book_romans_godet.html"],
    45:["1 Corinzi","https://biblicalstudies.org.uk/book_commentary-on-first-corinthians_godet.html"]};
  const L=[];
  L.push(["Matthew Henry","Commentario completo, sul capitolo "+c,`https://www.studylight.org/commentaries/eng/mhm/${s}-${c}.html`]);
  L.push(["Jamieson-Fausset-Brown","Commentario sul capitolo "+c,`https://www.studylight.org/commentaries/eng/jfb/${s}-${c}.html`]);
  if(AT) L.push(["Keil & Delitzsch","Commentario all'Antico Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/kad/${bh}/${c}.htm`]);
  if(GODET[i]) L.push(["Frédéric Godet","Commentario a "+GODET[i][0]+" (PDF da scaricare): cerca il capitolo "+c,GODET[i][1]]);
  if(!AT) L.push(["Bengel (Gnomon)","Gnomon del Nuovo Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/bengel/${bh}/${c}.htm`]);
  L.push(["Thomas Constable","Expository Notes (Sonic Light), sul capitolo "+c,`https://www.studylight.org/commentaries/eng/dcc/${s}-${c}.html`]);
  L.push(["David Guzik (Enduring Word)","Commentario sul capitolo "+c,`https://enduringword.com/bible-commentary/${b[2]}-${c}/`]);
  L.push(["Albert Barnes","Notes on the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/barnes/${bh}/${c}.htm`]);
  L.push(["John Gill","Exposition of the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/gill/${bh}/${c}.htm`]);
  L.push(["Ellicott","Commentary for English Readers, sul capitolo "+c,`https://biblehub.com/commentaries/ellicott/${bh}/${c}.htm`]);
  L.push(["Pulpit Commentary","Spiegazione, omiletica e omelie, sul capitolo "+c,`https://biblehub.com/commentaries/pulpit/${bh}/${c}.htm`]);
  L.push(["NET Bible","Traduzione con le note dei traduttori, sul capitolo "+c,`https://netbible.org/bible/${(bh==='songs'?'Song+of+Solomon':bh.split('_').map(w=>w[0].toUpperCase()+w.slice(1)).join('+'))}+${c}`]);
  return L;
}

function crumb(){
  const ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  document.querySelector('.bar').hidden=(st.b===null);
  let t='', back='';
  if(st.b!==null){
    t=B[st.b][0]+(st.c!==null?' '+st.c:'')+(st.v!==null?':'+st.v:'');
    const prev=st.v!==null?`go(${st.b},${st.c})`:st.c!==null?`go(${st.b})`:'go(null)';
    back=`<button class="back" id="back" onclick="${prev}" aria-label="Indietro">${ic}Indietro</button>`;
  }
  crumbs.innerHTML=back+`<div class="bar-title">${t}</div>`;
}

function render(){
  crumb();
  if(st.b===null){
    const btn=(i)=>`<button class="btn" onclick="go(${i})">${B[i][0]}</button>`;
    view.innerHTML=SEZ.map(([t,gr])=>`<h2 class="testamento">${t}</h2>`+gr.map(([n,a,z])=>
      `<div class="label">${n}</div><div class="books">${Array.from({length:z-a},(_,k)=>btn(a+k)).join('')}</div>`).join('')).join('');
  }else if(st.c===null){
    const b=B[st.b];
    view.innerHTML=`<div class="label">Capitolo</div><div class="grid">${b[3].map((_,i)=>`<button class="btn" onclick="go(${st.b},${i+1})">${i+1}</button>`).join('')}</div>`;
  }else if(st.v===null){
    const b=B[st.b], n=b[3][st.c-1];
    view.innerHTML=`<div class="label">Versetto</div><div class="grid">${Array.from({length:n},(_,i)=>`<button class="btn" onclick="go(${st.b},${st.c},${i+1})">${i+1}</button>`).join('')}</div>`;
  }else{
    const b=B[st.b];
    view.innerHTML=`<h2 class="ref">${b[0]} ${st.c}:${st.v}</h2><div class="links">${links(b,st.c,st.v).map(l=>`<a class="link" href="${l[2]}"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><span class="go">›</span></a>`).join('')}</div>
      <p class="note">I commentari sono in inglese e si aprono sul capitolo: scorri fino al versetto ${st.v}. Per tornare qui usa la freccia indietro.</p>`;
  }
  window.scrollTo(0,0);
}
function go(b=null,c=null,v=null){st={b,c,v};
  try{history.replaceState(null,'',b===null?location.pathname:'#'+[b,c,v].filter(x=>x!==null).join('-'));}catch(e){}
  render();}
(function(){let nav='navigate';try{nav=performance.getEntriesByType('navigation')[0].type;}catch(e){}
  if(nav!=='back_forward'){try{history.replaceState(null,'',location.pathname);}catch(e){}st={b:null,c:null,v:null};render();return;}
  const p=(location.hash||'').slice(1).split('-').map(Number).filter(n=>!isNaN(n));
  st={b:p[0]??null,c:p[1]??null,v:p[2]??null};
  if(st.b!==null&&!B[st.b])st={b:null,c:null,v:null};render();})();
</script>
