function dist(a,b,max){if(Math.abs(a.length-b.length)>max)return 99;const m=a.length,n=b.length;let pp=null,p=[],c=[];for(let j=0;j<=n;j++)p[j]=j;

function segna(n){try{sessionStorage.setItem(chiaveV(),n);}catch(e){}document.querySelectorAll('.links .link').forEach(x=>x.classList.toggle('ultimo',x.querySelector('strong').textContent===n));}
function links(b,c,v){
  const s=sl(b), bh=b[1], i=B.indexOf(b), AT=i<39;
  const GODET={41:["Vangelo di Luca","https://biblicalstudies.org.uk/blog/frederic-godets-commentary-on-the-gospel-of-luke/"],
    42:["Vangelo di Giovanni","https://biblicalstudies.org.uk/book_gospel-of-john_godet.html"],
    44:["Romani","https://biblicalstudies.org.uk/book_romans_godet.html"],
    45:["1 Corinzi","https://biblicalstudies.org.uk/book_commentary-on-first-corinthians_godet.html"]};
  const L=[];
  L.push(["Matthew Henry","Commentario completo, sul capitolo "+c,`https://www.studylight.org/commentaries/eng/mhm/${s}-${c}.html`]);
  L.push(["Jamieson-Fausset-Brown","Commentario sul capitolo "+c,`https://www.studylight.org/commentaries/eng/jfb/${s}-${c}.html`]);
  if(AT) L.push(["Keil & Delitzsch","Commentario all'Antico Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/kad/${bh}/${c}.htm`]);
  if(GODET[i]) L.push(["Frédéric Godet","Commentario a "+GODET[i][0]+" (PDF da scaricare): cerca il capitolo "+c,GODET[i][1]]);
  if(!AT) L.push(["Bengel (Gnomon)","Gnomon del Nuovo Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/bengel/${bh}/${c}.htm`]);
  L.push(["Thomas Constable","Expository Notes, al versetto "+c+":"+v,`https://www.studylight.org/commentaries/eng/dcc/${s}-${c}.html#verse-${v}`]);
  L.push(["David Guzik (Enduring Word)","Commentario sul capitolo "+c,`https://enduringword.com/bible-commentary/${b[2]}-${c}/`]);
  L.push(["Albert Barnes","Notes on the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/barnes/${bh}/${c}.htm`]);
  L.push(["John Gill","Exposition of the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/gill/${bh}/${c}.htm`]);
  L.push(["Ellicott","Commentary for English Readers, sul capitolo "+c,`https://biblehub.com/commentaries/ellicott/${bh}/${c}.htm`]);
  L.push(["Pulpit Commentary","Spiegazione, omiletica e omelie, sul capitolo "+c,`https://biblehub.com/commentaries/pulpit/${bh}/${c}.htm`]);
  L.push(["NET Bible","Traduzione con le note dei traduttori, sul capitolo "+c,`https://netbible.org/bible/${(bh==='songs'?'Song+of+Solomon':bh.split('_').map(w=>w[0].toUpperCase()+w.slice(1)).join('+'))}+${c}`]);
  return L;
}

function crumb(){
  const ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  document.querySelector('.bar').hidden=(cm===null&&scr==='home');
  if(cm===null&&scr!=='home'&&(st.b===null||scr==='f'||scr==='s'||scr==='d')){crumbs.innerHTML=`<button class="back" onclick="home()" aria-label="Indietro">${ic}Indietro</button><div class="bar-title">${scr==='f'?'I miei PDF':scr==='s'?'Segnalibri':scr==='d'?'Dizionario':mode==='p'?'Studio del versetto':'Commentari'}</div><button class="back homeb" onclick="home()" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>`;return;}
  let t='', back='';
  if(cm!==null){document.querySelector('.bar').hidden=false;
    t=cm<0?'Corso biblico':CL[cm][0]+' · '+CL[cm][1];
    back=`<button class="back" onclick="${cm<0?'go(null)':'goM(-1)'}" aria-label="Indietro">${ic}Indietro</button>`;
    crumbs.innerHTML=back+`<div class="bar-title">${t}</div><button class="back homeb" onclick="home()" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>`;return;}
  if(st.b!==null){
    t=B[st.b][0]+(st.c!==null?' '+st.c:'')+(st.v!==null?':'+st.v:'');
    if(mode==='p')t+=' · Studio';
    const prev=st.v!==null?`go(${st.b},${st.c})`:st.c!==null?`go(${st.b})`:'go(null)';
    back=`<button class="back" id="back" onclick="${prev}" aria-label="Indietro">${ic}Indietro</button>`;
  }
  const passa=(scr==='c'&&st.v!==null)?(mode==='p'?`<button class="back passab" onclick="mode='c';go(${st.b},${st.c},${st.v})">Commentari</button>`:`<button class="back passab" onclick="mode='p';go(${st.b},${st.c},${st.v})">Studio</button>`):'';
  crumbs.innerHTML=back+`<div class="bar-title">${t}</div>`+passa+`<button class="back homeb" onclick="home()" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>`;
}

function render(){
  crumb();
  if(cm===null&&scr==='d'){
    view.innerHTML=`<form class="cerca" style="margin-top:4px" onsubmit="event.preventDefault();suggDiz()"><input id="dzq" type="search" placeholder="Es. Melchisedec, tabernacolo, farisei…" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="suggDiz()"></form>
      <div id="dzr" class="links" style="margin-top:12px"></div>`;
    setTimeout(()=>{const i=document.getElementById('dzq');if(i)i.focus();},50);window.scrollTo(0,0);return;}
  if(cm===null&&scr==='s'){const a=segn();
    if(!RIV&&a.length)caricaRiv().then(d=>{if(d&&scr==='s')render();});
    view.innerHTML=""+(a.length?`<div class="links">${a.map((x,i)=>`<div class="link segn"><button class="sapri" onclick="mode='c';go(${x[0]},${x[1]},${x[2]})"><strong>${B[x[0]][0]} ${x[1]}:${x[2]}</strong><small>${RIV?testoV(x[0],x[1],x[2]).replace(/[<>&]/g,''):''}</small></button><button class="mini no" onclick="const a=segn();a.splice(${i},1);salvaSegn(a);render()">Togli</button></div>`).join('')}</div>`:`<p class="note">Nessun segnalibro. Apri un versetto e tocca ☆ per salvarlo.</p>`);
    window.scrollTo(0,0);return;}
  if(cm===null&&scr==='f'){
    view.innerHTML=`<p class="note" style="margin-top:4px">I PDF che aggiungi qui vengono salvati <strong>solo in questo browser, su questo dispositivo</strong>: non vanno su internet. Poi, quando apri un versetto nei Commentari, trovi il pulsante 📄 che apre il PDF già sulla pagina giusta.</p>
      <div class="links">${MIEI.map(m=>{const p=PRES[m[0]];return `<div class="link pdfslot"><div><strong>${m[1]}</strong><small>${m[2]}</small>
        <small id="st-${m[0]}" class="${p?'ok':''}">${p?'✓ Salvato: '+p.nome+' ('+p.mb+' MB)':'Non ancora aggiunto'}</small></div>
        <div class="slotbtn"><label class="mini">${p?'Sostituisci':'Scegli PDF'}<input type="file" accept="application/pdf,.pdf" hidden onchange="salvaPdf('${m[0]}',this)"></label>${p?`<button class="mini no" onclick="togliPdf('${m[0]}')">Togli</button>`:''}</div></div>`}).join('')}</div>`;
    window.scrollTo(0,0);return;}
  if(cm===null&&scr==='home'){
    view.innerHTML=`<div class="scelte">
      <button class="scelta" onclick="apri('c')"><strong>Commentari</strong><small>Scegli libro, capitolo e versetto e apri i commentari</small><span class="go">›</span></button>
      <button class="scelta" onclick="apri('p')"><strong>Studio del versetto</strong><small>Parole in ebraico e greco con il significato, e versetti correlati</small><span class="go">›</span></button>
      <button class="scelta" onclick="apri('d')"><strong>Dizionario</strong><small>Cerca una parola, un nome o un luogo biblico in Unger e Zondervan</small><span class="go">›</span></button>
      ${segn().length?`<button class="scelta piccola" onclick="apri('s')"><strong>★ Segnalibri</strong><small>${segn().length} versett${segn().length===1?'o salvato':'i salvati'}</small><span class="go">›</span></button>`:''}
      ${!PRESOK||MIEI.every(m=>PRES[m[0]])?'':`<button class="scelta piccola" onclick="apri('f')"><strong>📄 I miei PDF</strong><small>Aggiungi i tuoi commentari in PDF: restano solo su questo dispositivo</small><span class="go">›</span></button>`}</div>
`;
    window.scrollTo(0,0);return;}
  if(cm===null&&scr==='p'){
    view.innerHTML=`<h2 class="ref">Studio del versetto</h2>
      <form class="cerca" onsubmit="event.preventDefault();cerca('text')">
        <input id="ref" type="text" placeholder="es. Gen 1:1" autocomplete="off" autocapitalize="off" enterkeyhint="go"></form>
      <p id="err" class="err" hidden></p>
      <div class="azioni">
        <button class="az" onclick="cerca('text')"><strong>Parole e significato</strong><small>Ogni parola in ebraico o greco, con pronuncia, traduzione e significato</small></button>
        <button class="az" onclick="cerca('crossref')"><strong>Versetti correlati</strong><small>I passi della Bibbia collegati a questo versetto</small></button>
      </div>
      <p class="note">Scrivi il versetto, poi scegli cosa aprire. Si apre Bible Hub su quel versetto. Puoi scrivere abbreviazioni (Gen 1:1, Gv 3:16, 1 Co 13:4) o il nome intero.</p>`;
    window.scrollTo(0,0);return;}
  if(cm!==null){
    if(cm<0){
      view.innerHTML=CORSO.map(([sez,arr])=>`<div class="label">${sez}</div><div class="links">`+arr.map(m=>{const i=CL.indexOf(m);
        return `<button class="link mat" onclick="goM(${i})"><div><strong>${m[0]} · ${m[1]}</strong><small>${m[2]}</small></div><span class="go">›</span></button>`}).join('')+'</div>').join('');
    }else{
      const m=CL[cm],[L,R]=corsoLinks(m),a=l=>`<a class="link" href="${l[2]}"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><span class="go">›</span></a>`;
      view.innerHTML=`<h2 class="ref">${m[1]}</h2>`+(L.length?`<div class="label">Letture</div><div class="links">${L.map(a).join('')}</div>`:'')+
        `<div class="label">Cerca su siti evangelici</div><div class="links">${R.map(a).join('')}</div>
        <p class="note">Le ricerche si aprono su Google, limitate a quel sito. GotQuestions è in italiano, gli altri in inglese: per tradurre usa aA › Traduci in Safari.</p>`;
    }
    window.scrollTo(0,0);return;
  }
  if(st.b===null){
    const btn=(i)=>`<button class="btn" onclick="go(${i})">${B[i][0]}</button>`;
    view.innerHTML='<div class="duecol">'+SEZ.map(([t,gr])=>`<div><h2 class="testamento">${t}</h2>`+gr.map(([n,a,z])=>
      `<div class="label">${n}</div><div class="books">${Array.from({length:z-a},(_,k)=>btn(a+k)).join('')}</div>`).join('')+'</div>').join('')+'</div>';
  }else if(st.c===null){
    const b=B[st.b];
    view.innerHTML=`<div class="label">Capitolo</div><div class="grid">${b[3].map((_,i)=>`<button class="btn" onclick="go(${st.b},${i+1})">${i+1}</button>`).join('')}</div>`;
  }else if(st.v===null){
    const b=B[st.b], n=b[3][st.c-1];
    view.innerHTML=`<div class="label">Versetto</div><div class="grid">${Array.from({length:n},(_,i)=>`<button class="btn" onclick="go(${st.b},${st.c},${i+1})">${i+1}</button>`).join('')}</div>`;
  }else{
    const b=B[st.b];
    if(mode==='p'){const bh=b[1],AT=B.indexOf(b)<39,P=[
      ['Parole e significato','Ogni parola in '+(AT?'ebraico':'greco')+', con pronuncia, traduzione e significato',`https://biblehub.com/text/${bh}/${st.c}-${st.v}.htm`],
      ['Versetti correlati','I passi della Bibbia collegati a questo versetto',`https://biblehub.com/crossref/${bh}/${st.c}-${st.v}.htm`],
      ['NET Bible (note dei traduttori)','Greco/ebraico, scelte di traduzione e varianti del testo',`https://netbible.org/bible/${encodeURIComponent((bh==='songs'?'song_of_solomon':bh).replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())).replace(/%20/g,'+')}+${st.c}:${st.v}`]];
      view.innerHTML=`<h2 class="ref">${b[0]} ${st.c}:${st.v}</h2><div class="links">${P.map(l=>`<a class="link" href="${l[2]}"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><span class="go">›</span></a>`).join('')}</div>`;window.scrollTo(0,0);return;}
    const ii=B.indexOf(b),on=links(b,st.c,st.v),O=n=>on.find(l=>l[0].startsWith(n)),P=k=>{const m=MIEI.find(x=>x[0]===k);if(!m||!PRES[k])return null;const pg=pagina(k,ii,st.c,st.v);return pg?['📄 '+m[1],'PDF dal tuo dispositivo, pagina '+pg,null,k,pg]:null;};
    const ORD=[O('Thomas Constable'),P('ivp'),P('ivpnt'),P('mac'),P('macnt')].filter(Boolean).map(l=>{const NM={'Thomas Constable':'Constable','Albert Barnes':'Barnes',ivp:'IVP',ivpnt:'IVP',moody:'Moody',mac:'MacDonald',macnt:'MacDonald'};return [NM[l[3]]||NM[l[0]]||l[0],l[1],l[2],l[3],l[4]];});
    const sg=haSegn(st.b,st.c,st.v),tv=RIV?testoV(st.b,st.c,st.v):'';
    view.innerHTML=`<div class="refrow"><h2 class="ref">${b[0]} ${st.c}:${st.v}</h2><button id="stella" class="stella ${sg?'on':''}" onclick="toggleSegn()" title="${sg?'Togli dai segnalibri':'Aggiungi ai segnalibri'}">${sg?'★':'☆'}</button></div><div class="links">${ORD.map(l=>l[2]?`<a class="link ${ultimo()===l[0]?'ultimo':''}" href="${l[2]}" onclick="segna('${l[0]}')"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><span class="go">›</span></a>`:`<button class="link ${ultimo()===l[0]?'ultimo':''}" onclick="segna('${l[0]}');apriPdf('${l[3]}',${l[4]})"><div><strong>${l[0]}</strong><small>${l[1]}</small></div><span class="go">›</span></button>`).join('')}</div>
`;
  }
  window.scrollTo(0,0);
}
function goM(i){cm=i;try{history.replaceState(null,'',i<0?'#m':'#m'+i);}catch(e){}render();}
function go(b=null,c=null,v=null){cm=null;scr='c';st={b,c,v};
  try{history.replaceState(null,'',b===null?'#'+mode:'#'+(mode==='p'?'p':'')+[b,c,v].filter(x=>x!==null).join('-'));}catch(e){}
  render();}
aggiornaPres().then(()=>{if(scr==='f'||scr==='home'||st.v!==null)render();});
(function(){let nav='navigate';try{nav=performance.getEntriesByType('navigation')[0].type;}catch(e){}
  if(nav!=='back_forward'){try{history.replaceState(null,'',location.pathname);}catch(e){}scr='home';st={b:null,c:null,v:null};render();return;}
  const hh=(location.hash||'').slice(1); if(hh==='p'||hh==='c'){mode=hh;scr='c';render();return;} let h2=hh; if(/^p\d/.test(hh)){mode='p';h2=hh.slice(1);} if(/^\d/.test(h2))scr='c'; if(hh[0]==='m'){const n=parseInt(hh.slice(1));cm=isNaN(n)||!CL[n]?-1:n;render();return;}
  const p=h2.split('-').map(Number).filter(n=>!isNaN(n));
  st={b:p[0]??null,c:p[1]??null,v:p[2]??null};
  if(st.b!==null&&!B[st.b]){st={b:null,c:null,v:null};scr='home';}render();})();
</script>
