/* Layout: barra superiore fissa con tasto Indietro, contenuto in colonna, libri come chip arrotondati */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --fg:#14213d; --muted:#64748b; --line:#e3e9f2;
  --accent:#1f5fd1; --accent-soft:#e8f0fe; --bar:#0f1f3d; --barfg:#ffffff;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#142036; --fg:#e7edf7; --muted:#94a3b8; --line:#22314d;
  --accent:#6ea8ff; --accent-soft:#1a2c4d; --bar:#0a1220; --barfg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#142036; --fg:#e7edf7; --muted:#94a3b8; --line:#22314d;
  --accent:#6ea8ff; --accent-soft:#1a2c4d; --bar:#0a1220; --barfg:#ffffff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barfg);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border:0;color:#fff;
  font:600 15px var(--font);padding:10px 14px 10px 10px;border-radius:999px;cursor:pointer;flex-shrink:0}
.back svg{width:20px;height:20px}
.back:hover,.back:focus-visible{background:rgba(255,255,255,.22);outline:none}
.bar-title{font-weight:800;font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2.testamento{font-size:1.9rem;font-weight:800;margin:22px 0 6px;letter-spacing:-.02em}
h2.testamento ~ h2.testamento{margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.books{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--fg);
  font:600 15px var(--font);padding:11px 14px;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.grid .btn{padding:12px 0;text-align:center}
.btn:hover,.btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);outline:none}
.links{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.link{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px;color:var(--fg);text-decoration:none;transition:border-color .15s}
.link:hover,.link:focus-visible{border-color:var(--accent);outline:none}
.link div{flex:1;min-width:0}
.link strong{display:block;font-size:1.02rem;font-weight:700}
.link small{color:var(--muted);font-size:.85rem}
.link .go{color:var(--accent);font-weight:800;font-size:1.2rem}
.corso-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;position:relative;text-align:left;
  background:var(--accent);color:#fff;border:0;border-radius:16px;padding:18px 44px 18px 18px;margin-top:8px;cursor:pointer;font:inherit}
.corso-btn strong{font-size:1.15rem;font-weight:800}.corso-btn small{opacity:.85;font-size:.88rem}
.corso-btn .go{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-size:1.5rem;font-weight:800}
button.link{width:100%;text-align:left;font:inherit;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:8px}
.tab{background:none;border:0;border-radius:10px;padding:12px 6px;font:700 15px var(--font);color:var(--muted);cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.cerca{display:flex;gap:8px;margin-top:12px}
.cerca input{flex:1;min-width:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:16px var(--font)}
.cerca input:focus{outline:none;border-color:var(--accent)}
.cerca button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 20px;font:700 15px var(--font);cursor:pointer}
.err{color:#e5484d;font-size:.88rem;margin:8px 2px 0}
.eyebrow-p{color:var(--muted);margin:0 0 8px;font-size:.9rem}
.scelte{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.scelta{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:26px 48px 26px 20px;cursor:pointer;font:inherit}
.scelta strong{font-size:1.4rem;font-weight:800}.scelta small{color:var(--muted);font-size:.92rem}
.scelta .go{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:1.6rem;font-weight:800}
.scelta:hover,.scelta:focus-visible{border-color:var(--accent);outline:none}
.sec{display:block;width:100%;margin-top:10px;background:var(--surface);color:var(--accent);border:1px solid var(--line);border-radius:12px;padding:12px;font:600 15px var(--font);cursor:pointer}
.azioni{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.az{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:16px 18px;cursor:pointer;font:inherit}
.az strong{font-size:1.08rem;font-weight:800}.az small{opacity:.88;font-size:.86rem}
.az + .az{background:var(--surface);color:var(--fg);border:1px solid var(--line)}.az + .az small{color:var(--muted);opacity:1}
h2.ref{font-size:1.6rem;font-weight:800;margin:6px 0 4px;letter-spacing:-.01em}
.note{color:var(--muted);font-size:.85rem;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (hover:hover){
  .btn,.link,.scelta,.az,.sec{transition:background .18s,color .18s,border-color .18s,transform .18s}
  .btn:hover,.link:hover,.scelta:hover,.az:hover,.az + .az:hover,.sec:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.03);text-decoration:none}
  .link:hover small,.scelta:hover small,.az:hover small,.az + .az:hover small,.link:hover .go,.scelta:hover .go{color:#fff}
  .link:hover strong{text-decoration:none}
  .back{transition:background .18s,transform .18s}
  .back:hover{background:var(--accent);transform:scale(1.06)}
}
@media (prefers-reduced-motion:reduce){.btn:hover,.link:hover,.scelta:hover,.az:hover,.sec:hover,.back:hover{transform:none}}
</style>

function corsoLinks(m){

    L.push([b[0]+' – Constable','Introduzione al libro: autore, data, struttura, temi',`https://www.studylight.org/commentaries/eng/dcc/${s}-1.html`]);

  const R=[
    ['Cerca su GotQuestions (italiano)','Articoli evangelici brevi su «'+it+'»',g('site:gotquestions.org/Italiano '+it)],

  return [L,R];
}

const norm=x=>x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function trovaLibro(t){const k=norm(t);if(!k)return -1;if(k in ABBR)return ABBR[k];
  const i=B.findIndex(b=>norm(b[0])===k);if(i>=0)return i;return B.findIndex(b=>norm(b[0]).startsWith(k));}
function cerca(tipo='text'){const v=document.getElementById('ref').value.trim(),e=document.getElementById('err');
  const m=v.match(/^\s*([1-3]?\s*[^\d\s:.,][^\d:.,]*?)\s*(\d+)\s*(?:[:.,]\s*(\d+))?\s*$/);
  const fail=t=>{e.textContent=t;e.hidden=false;};
  if(!m)return fail('Scrivi il riferimento così: Gen 1:1, Gv 3:16, 1 Co 13:4');
  const i=trovaLibro(m[1]);if(i<0)return fail('Non trovo il libro «'+m[1].trim()+'». Prova con il nome intero, es. Genesi 1:1');
  const c=+m[2],vv=m[3]?+m[3]:null,ch=B[i][3];
  if(c<1||c>ch.length)return fail(B[i][0]+' ha '+ch.length+' capitoli.');
  if(vv!==null&&(vv<1||vv>ch[c-1]))return fail(B[i][0]+' '+c+' ha '+ch[c-1]+' versetti.');
  if(vv===null)return fail('Scrivi anche il versetto, es. '+B[i][0]+' '+c+':1');
  location.href=`https://biblehub.com/${tipo}/${B[i][1]}/${c}-${vv}.htm`;}
const view=document.getElementById('view'), crumbs=document.getElementById('crumbs');

function sl(b){return b[1]==='songs'?'song-of-solomon':b[1].replace('_','-');}
function links(b,c,v){

  const GODET={41:["Vangelo di Luca","https://biblicalstudies.org.uk/blog/frederic-godets-commentary-on-the-gospel-of-luke/"],

    45:["1 Corinzi","https://biblicalstudies.org.uk/book_commentary-on-first-corinthians_godet.html"]};
  const L=[];
  L.push(["Matthew Henry","Commentario completo, sul capitolo "+c,`https://www.studylight.org/commentaries/eng/mhm/${s}-${c}.html`]);
  L.push(["Jamieson-Fausset-Brown","Commentario sul capitolo "+c,`https://www.studylight.org/commentaries/eng/jfb/${s}-${c}.html`]);
  if(AT) L.push(["Keil & Delitzsch","Commentario all'Antico Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/kad/${bh}/${c}.htm`]);
  if(GODET[i]) L.push(["Frédéric Godet","Commentario a "+GODET[i][0]+" (PDF da scaricare): cerca il capitolo "+c,GODET[i][1]]);
  if(!AT) L.push(["Bengel (Gnomon)","Gnomon del Nuovo Testamento, sul capitolo "+c,`https://biblehub.com/commentaries/bengel/${bh}/${c}.htm`]);
  L.push(["Thomas Constable","Expository Notes (Sonic Light), sul capitolo "+c,`https://www.studylight.org/commentaries/eng/dcc/${s}-${c}.html`]);
  L.push(["David Guzik (Enduring Word)","Commentario sul capitolo "+c,`https://enduringword.com/bible-commentary/${b[2]}-${c}/`]);
  L.push(["Albert Barnes","Notes on the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/barnes/${bh}/${c}.htm`]);
  L.push(["John Gill","Exposition of the Bible, sul capitolo "+c,`https://biblehub.com/commentaries/gill/${bh}/${c}.htm`]);
  L.push(["Ellicott","Commentary for English Readers, sul capitolo "+c,`https://biblehub.com/commentaries/ellicott/${bh}/${c}.htm`]);
  L.push(["Pulpit Commentary","Spiegazione, omiletica e omelie, sul capitolo "+c,`https://biblehub.com/commentaries/pulpit/${bh}/${c}.htm`]);
  L.push(["NET Bible","Traduzione con le note dei traduttori, sul capitolo "+c,`https://netbible.org/bible/${(bh==='songs'?'Song+of+Solomon':bh.split('_').map(w=>w[0].toUpperCase()+w.slice(1)).join('+'))}+${c}`]);
  return L;
}

function crumb(){
  const ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  document.querySelector('.bar').hidden=(cm===null&&scr==='home');
  if(cm===null&&scr!=='home'&&st.b===null){crumbs.innerHTML=`<button class="back" onclick="home()" aria-label="Indietro">${ic}Indietro</button><div class="bar-title">${mode==='p'?'Studio del versetto':'Commentari'}</div>`;return;}
  let t='', back='';
  if(cm!==null){document.querySelector('.bar').hidden=false;
    t=cm<0?'Corso biblico':CL[cm][0]+' · '+CL[cm][1];
    back=`<button class="back" onclick="${cm<0?'go(null)':'goM(-1)'}" aria-label="Indietro">${ic}Indietro</button>`;
    crumbs.innerHTML=back+`<div class="bar-title">${t}</div>`;return;}
  if(st.b!==null){
    t=B[st.b][0]+(st.c!==null?' '+st.c:'')+(st.v!==null?':'+st.v:'');
    if(mode==='p')t+=' · Studio';
    const prev=st.v!==null?`go(${st.b},${st.c})`:st.c!==null?`go(${st.b})`:'go(null)';
    back=`<button class="back" id="back" onclick="${prev}" aria-label="Indietro">${ic}Indietro</button>`;
  }
  crumbs.innerHTML=back+`<div class="bar-title">${t}</div>`;
}

    window.scrollTo(0,0);return;}

    view.innerHTML=`<h2 class="ref">Studio del versetto</h2>

    }

  }else if(st.c===null){

  }else{

      ['Parole e significato','Ogni parola in '+(AT?'ebraico':'greco')+', con pronuncia, traduzione e significato',`https://biblehub.com/text/${bh}/${st.c}-${st.v}.htm`],

function goM(i){cm=i;try{history.replaceState(null,'',i<0?'#m':'#m'+i);}catch(e){}render();}
function go(b=null,c=null,v=null){cm=null;scr='c';st={b,c,v};

(function(){let nav='navigate';try{nav=performance.getEntriesByType('navigation')[0].type;}catch(e){}
  if(nav!=='back_forward'){try{history.replaceState(null,'',location.pathname);}catch(e){}scr='home';st={b:null,c:null,v:null};render();return;}
  const hh=(location.hash||'').slice(1); if(hh==='p'||hh==='c'){mode=hh;scr='c';render();return;} let h2=hh; if(/^p\d/.test(hh)){mode='p';h2=hh.slice(1);} if(/^\d/.test(h2))scr='c'; if(hh[0]==='m'){const n=parseInt(hh.slice(1));cm=isNaN(n)||!CL[n]?-1:n;render();return;}
  const p=h2.split('-').map(Number).filter(n=>!isNaN(n));
  st={b:p[0]??null,c:p[1]??null,v:p[2]??null};
  if(st.b!==null&&!B[st.b]){st={b:null,c:null,v:null};scr='home';}render();})();
