async function dbDel(k){const d=await db();return new Promise((ok)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=ok;});}

async function calcFit(n){const pg=await VIS.doc.getPage(n),tc=await pg.getTextContent(),box=document.getElementById('vbox');
  const hs=tc.items.filter(it=>it.str&&it.str.trim().length>2).map(it=>Math.hypot(it.transform[2],it.transform[3])).filter(h=>h>4&&h<40).sort((a,b)=>a-b);

  const tl=document.createElement('div');tl.className='textLayer';el.appendChild(tl);

  return el;}

async function disegna(t){if(!VIS)return;t=t||VIS.p;const box=document.getElementById('vbox'),N=VIS.doc.numPages;CARICO=true;

  VIS.first=from;VIS.last=to;VIS.p=t;const el=box.querySelector(`.vpage[data-p="${t}"]`);box.scrollTop=el?el.offsetTop-8:0;aggPag();CARICO=false;}
async function altrePagine(){if(!VIS||CARICO)return;const box=document.getElementById('vbox'),N=VIS.doc.numPages;
  if(box.scrollTop+box.clientHeight>box.scrollHeight-1200&&VIS.last<N){CARICO=true;VIS.last++;box.appendChild(await creaPagina(VIS.last));
    while(box.children.length>10){const f=box.firstElementChild,h=f.offsetHeight+16;f.remove();VIS.first++;box.scrollTop-=h;}CARICO=false;}
  else if(box.scrollTop<800&&VIS.first>1){CARICO=true;VIS.first--;const el=await creaPagina(VIS.first),h0=box.scrollHeight;box.insertBefore(el,box.firstElementChild);box.scrollTop+=box.scrollHeight-h0;
    while(box.children.length>10){box.lastElementChild.remove();VIS.last--;}CARICO=false;}
  const lim=box.scrollTop+box.clientHeight*0.3;let cur=VIS.first;for(const e of box.children){if(e.offsetTop<=lim)cur=+e.dataset.p;}
  if(cur!==VIS.p){VIS.p=cur;aggPag();}}
async function testoPagina(){const pg=await VIS.doc.getPage(VIS.p),tc=await pg.getTextContent();

  return t;}
